name: Deploy web to GitHub Pages

# Publishes the web build attached to an existing GitHub Release.
#   Manual : Actions tab -> "Deploy web to GitHub Pages" -> Run workflow -> enter the tag (e.g. v0.0.1)
#   Later  : release.yml can call this file with `uses: ./.github/workflows/pages.yml` (see README)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (exactly as shown on the Releases page)"
        required: true
        default: "v0.0.1"
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web build from the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-web.zip' --dir dl
          unzip -q dl/*-web.zip -d dl/unzipped
          mkdir site
          cp -r dl/unzipped/*/. site/
          test -f site/index.html
          ls -l site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
